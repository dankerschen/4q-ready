<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4th Quarter Ready</title>
<meta name="description" content="Training plan and tracker: sessions, physio core, Achilles log.">
<meta name="theme-color" content="#e8590c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#e8590c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="4Q Ready">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#fdf7f0; --card:#ffffff; --ink:#1f1a15; --muted:#6b5f53; --line:#f0e0cd;
  --accent:#e8590c; --accent-ink:#1c1105; --accent-text:#b4470a; --soft:#fff0dd; --good:#2b8a3e; --bad:#c92a2a; --warn:#b7791f; --chip:#f8ecdd;
  --grad:linear-gradient(135deg,#f76707,#fcc419); --head:linear-gradient(135deg,#e8590c,#c2410c);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#15110d; --card:#211a14; --ink:#f6efe7; --muted:#b3a595; --line:#3b2f23;
    --accent:#ff922b; --accent-ink:#1c1105; --accent-text:#ffb454; --soft:#33240f; --good:#69db7c; --bad:#ff8787; --warn:#ffd43b; --chip:#2c231a; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap}
#syncStatus{font-size:12px;color:var(--muted);text-align:right}
main{max-width:860px;margin:0 auto;padding:12px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card h2{font-size:17px;margin:0 0 6px}
.card h3{font-size:15px;margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap} .spread>.row{flex-wrap:nowrap;flex:none} #acctBtn{white-space:nowrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn{font:inherit;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.wide{width:100%} .btn.on{outline:2px solid var(--accent);background:var(--soft)}
.btn:disabled{opacity:.5}
.linkish{background:none;border:0;color:var(--accent);font:inherit;padding:8px 0;cursor:pointer;text-decoration:underline;min-height:44px}
.note .linkish,p .linkish{min-height:0;padding:4px 0}
a{color:var(--accent)}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
textarea{min-height:120px;resize:vertical}
input.short{width:96px} input.tiny{width:72px}
label.check{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
label.check input{width:24px;height:24px;flex:none}
.block{border-top:1px solid var(--line);padding:12px 0 4px}
.block:first-of-type{border-top:0}
.circles{display:flex;gap:8px;flex-wrap:wrap}
.circle{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--muted);background:transparent;cursor:pointer;padding:0;font-size:20px;color:var(--accent-ink)}
.circle.on{background:var(--accent);border-color:var(--accent)}
.circle.on::after{content:"✓"}
.ex{display:grid;grid-template-columns:76px 1fr;gap:8px;padding:4px 0;font-size:15px}
.ex .reps{font-weight:600;font-variant-numeric:tabular-nums}
button.ex{grid-template-columns:76px 1fr auto;width:100%;font:inherit;font-size:15px;color:inherit;background:none;border:0;text-align:left;cursor:pointer;align-items:start;min-height:32px}
.ex .exi{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:700;font-style:italic;text-align:center;line-height:18px}
.ex .how{grid-column:2;font-size:13px;color:var(--muted);margin-top:-2px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--chip);color:var(--muted);margin-left:4px;white-space:nowrap}
.tag.w{background:var(--soft);color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg .btn{padding:8px 6px;font-size:14px;line-height:1.2}
.scores{display:flex;gap:4px;flex-wrap:wrap}
.score{width:40px;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;cursor:pointer;padding:0}
.score.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.note{background:var(--soft);border-radius:10px;padding:10px;margin:8px 0;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{font:inherit;font-size:13px;min-height:60px;border:0;background:none;color:var(--muted);cursor:pointer}
nav button.on{color:var(--accent);font-weight:700}
nav button span{display:block;font-size:20px;line-height:1.2}
#restBar{position:fixed;left:8px;right:8px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:7;background:var(--ink);color:var(--bg);
  border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(0,0,0,.3)}
#restBar[hidden]{display:none} [hidden]{display:none!important}
#restBar b{font-size:26px;font-variant-numeric:tabular-nums;flex:1}
#restBar .btn{min-height:40px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:18px;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.or{text-align:center;color:var(--muted);font-size:13px;margin:10px 0}
#ivBig{font-size:84px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
#ivPhase{text-align:center;font-size:26px;font-weight:700;letter-spacing:.04em}
#ivDlg.hard{background:var(--accent);color:var(--accent-ink)}
.wkrow{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--ink);
  background:none;border:0;border-top:1px solid var(--line);padding:10px 0;min-height:56px;cursor:pointer}
.wkrow.today .d{color:var(--accent);font-weight:700}
.marks{display:flex;gap:6px;align-items:center;font-size:13px;white-space:nowrap}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--muted)}
.pill.done{background:var(--good);color:var(--card)} .pill.skip{background:var(--chip);color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{text-align:left;padding:6px 8px 6px 0;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;border-top:0}
.bars{display:flex;align-items:flex-end;gap:3px;height:70px;margin:8px 0}
.bars i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.bars i.none{background:var(--line)} .bars i.hi{background:var(--bad)}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
@media (min-width:700px){ .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start} .cols .card{margin:0 0 12px} }
/* ---- colour theme: orange / amber ---- */
header{background:var(--head);border-bottom:0;color:#fff} header h1{color:#fff}
#syncStatus{color:rgba(255,255,255,.92)}
#acctBtn{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4);color:#fff}
.card h2,.card h3{color:var(--accent-text)}
.card h2 .muted,.card h3 .tag{font-weight:400}
.card.top{background:var(--soft);border-color:transparent;border-left:5px solid var(--accent)}
.btn.primary{background:var(--grad);border-color:transparent}
.circle{border-color:var(--accent)} .circle.on{background:var(--grad);border-color:transparent}
.ex .reps{color:var(--accent-text)}
.score.on{background:var(--grad);border-color:transparent}
nav button.on{color:var(--accent-text);box-shadow:inset 0 3px 0 var(--accent)}
#restBar{background:var(--grad);color:var(--accent-ink)}
#restBar .btn{background:rgba(255,255,255,.4);border-color:transparent;color:var(--accent-ink)}
.linkish,a,.tag.w,.wkrow.today .d{color:var(--accent-text)}
.bars i{background:var(--grad)} .bars i.none{background:var(--line)} .bars i.hi{background:var(--bad)}
input[type=checkbox]{accent-color:var(--accent)}
input:focus-visible,textarea:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#ivDlg.hard{background:var(--grad)}
#ivCfg{display:grid;grid-template-columns:1fr 1fr 1.6fr 1fr;gap:8px;margin-top:12px;align-items:end}
#ivCfg label{display:flex;flex-direction:column;gap:4px;min-width:0}
#ivCfg input,#ivCfg select{width:100%;min-width:0;text-align:center;padding:10px 4px}
#ivDlg .dlg-row{justify-content:center}
.editrow{display:grid;grid-template-columns:84px 1fr auto auto auto;gap:6px;margin:0;padding:8px 0;border-top:1px solid var(--line)}
.editrow .pename{grid-row:1;grid-column:2/-1} .editrow .pereps{grid-row:1;grid-column:1;text-align:center} .editrow .btn:first-of-type{grid-column:3}
.editrow .btn{min-width:44px;padding:8px}
/* ---- layout refinements ---- */
.brand{flex:1;min-width:0} header h1{flex:none;line-height:1.2} #syncStatus{display:block;text-align:left;line-height:1.2}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text)}
.eyebrow .linkish{font-size:12px;letter-spacing:0;text-transform:none;font-weight:400;min-height:0;padding:0}
.card.top h2{font-size:20px;margin:0}
.navbtn{min-width:44px;padding:8px 0;background:var(--card)}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:10px 0 8px}
.sd{font:inherit;color:var(--ink);background:var(--card);border:1px solid transparent;border-radius:10px;padding:5px 0 6px;min-height:58px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.sd span{font-size:11px;color:var(--muted)} .sd b{font-size:15px}
.sd i{width:8px;height:8px;border-radius:50%;border:2px solid transparent;box-sizing:border-box}
.sd i.session{border-color:var(--accent)} .sd i.game{background:var(--ink)} .sd i.dn{background:var(--good)} .sd i.skip{background:var(--line)}
.sd.gd{background:color-mix(in srgb,var(--accent) 16%,var(--card));border-color:var(--accent)}
.sd em{font-style:normal;font-size:12px;line-height:1.15;display:flex;flex-direction:column;align-items:center;color:var(--ink)} .sd em small{font-size:10px;font-weight:700;font-variant-numeric:tabular-nums}
.sd.now b{color:var(--accent-text)} .sd.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.prog{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin:10px 0 2px}
.prog i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .25s}
.blockhead{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;min-height:32px}
button.blockhead{cursor:pointer}
.block.done h3{color:var(--good)}
.scores{display:grid;grid-template-columns:repeat(11,1fr);gap:3px} .score{width:auto;min-width:0}
@media (max-width:460px){ .scores{grid-template-columns:repeat(6,1fr);gap:4px} }
.card details summary{font-weight:400;color:var(--muted);font-size:14px}
body:has(#restBar:not([hidden])){padding-bottom:calc(150px + env(safe-area-inset-bottom))}
main{padding-top:14px} .card{box-shadow:0 1px 2px rgba(60,30,0,.04)}
#optBtn{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4);color:#fff;min-width:44px;padding:8px 0;font-size:18px}
.game{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.game b{color:var(--accent-text);font-variant-numeric:tabular-nums}
#optBody h3{margin:16px 0 0;color:var(--accent-text)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:8px 0}
.swatch{font:inherit;font-size:13px;color:var(--ink);background:var(--chip);border:2px solid transparent;border-radius:12px;padding:8px 6px;min-height:64px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.swatch i{width:100%;height:22px;border-radius:7px}
.swatch.on{border-color:var(--accent)}
/* ---- colour themes (Options). Default is amber; each theme only swaps the colour variables. ---- */
:root[data-theme=blue]{ --bg:#f3f7fd; --line:#d9e4f5; --accent:#1c64d9; --accent-ink:#fff; --accent-text:#1a4fb0; --soft:#e3eeff; --chip:#e9f0fb;
  --grad:linear-gradient(135deg,#1857c0,#2f7fe0); --head:linear-gradient(135deg,#1c64d9,#1548a8); }
:root[data-theme=green]{ --bg:#f3f8f3; --line:#d6e8d8; --accent:#2b8a3e; --accent-ink:#fff; --accent-text:#226e32; --soft:#e2f3e4; --chip:#e8f1e9;
  --grad:linear-gradient(135deg,#237a36,#2f9247); --head:linear-gradient(135deg,#2b8a3e,#1f6b2f); }
:root[data-theme=crimson]{ --bg:#fdf5f5; --line:#f2dada; --accent:#c92a2a; --accent-ink:#fff; --accent-text:#a51d1d; --soft:#ffe8e8; --chip:#f8eaea;
  --grad:linear-gradient(135deg,#c92a2a,#e03131); --head:linear-gradient(135deg,#c92a2a,#9c1c1c); }
:root[data-theme=graphite]{ --bg:#f4f5f7; --line:#dfe3e8; --accent:#343a40; --accent-ink:#fff; --accent-text:#343a40; --soft:#e9ecef; --chip:#eceff3;
  --grad:linear-gradient(135deg,#343a40,#5c6670); --head:linear-gradient(135deg,#343a40,#1a1d21); }
@media (prefers-color-scheme: dark){
  :root[data-theme=blue]{ --bg:#0e1218; --card:#171d27; --line:#2a3546; --ink:#eef2f8; --muted:#9daabd; --accent:#6ea8fe; --accent-text:#8fbcff; --soft:#16263f; --chip:#1f2836; }
  :root[data-theme=green]{ --bg:#0e1410; --card:#17201a; --line:#2a3a2e; --ink:#eef5ef; --muted:#9db3a2; --accent:#69db7c; --accent-text:#8ce99a; --soft:#173021; --chip:#1f2a22; }
  :root[data-theme=crimson]{ --bg:#150e0e; --card:#211616; --line:#3d2626; --ink:#f8eeee; --muted:#b9a1a1; --accent:#ff8787; --accent-text:#ffa8a8; --soft:#3a1717; --chip:#2c1c1c; }
  :root[data-theme=graphite]{ --bg:#101214; --card:#1a1d21; --line:#2c3238; --ink:#f1f3f5; --muted:#a3acb5; --accent:#ced4da; --accent-ink:#111418; --accent-text:#e9ecef; --soft:#262b31; --chip:#23282e;
    --grad:linear-gradient(135deg,#ced4da,#f1f3f5); }
}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>4th Quarter Ready</h1><span id="syncStatus"></span></div>
  <button class="btn" id="optBtn" aria-label="Options" title="Options">⚙</button>
  <button class="btn" id="acctBtn" hidden>Sign in</button>
</header>
<main id="view"></main>

<div id="restBar" hidden>
  <span class="small">Rest</span><b id="restLeft">0:45</b>
  <button class="btn" data-act="rest-add">+15 s</button>
  <button class="btn" data-act="rest-stop">Stop</button>
</div>

<nav id="tabs">
  <button data-tab="today"><span>●</span>Today</button>
  <button data-tab="week"><span>▦</span>Week</button>
  <button data-tab="physio"><span>✚</span>Physio core</button>
  <button data-tab="log"><span>↗</span>Progress</button>
</nav>

<dialog id="acctDlg"><div id="acctBody"></div><div class="dlg-row"><button class="btn" data-close>Close</button></div></dialog>
<dialog id="optDlg"><div id="optBody"></div><div class="dlg-row"><button class="btn" data-close>Close</button></div></dialog>
<dialog id="infoDlg"><div id="infoBody"></div><div class="dlg-row"><button class="btn" data-close>Close</button></div></dialog>
<dialog id="askDlg"><p id="askMsg"></p><div class="dlg-row"><button class="btn primary" id="askYes">Yes</button><button class="btn" id="askNo">No</button></div></dialog>
<dialog id="ivDlg">
  <div id="ivPhase">Interval timer</div>
  <div id="ivBig" hidden></div>
  <p class="small" id="ivRound" style="text-align:center"></p>
  <div class="row" id="ivCfg">
    <label class="small">Hard<input class="tiny" id="ivWork" type="number" min="1" inputmode="decimal"></label>
    <label class="small">Easy<input class="tiny" id="ivRest" type="number" min="0" inputmode="decimal"></label>
    <label class="small">Unit<select id="ivUnit"><option value="1">seconds</option><option value="60">minutes</option></select></label>
    <label class="small">Rounds<input class="tiny" id="ivRounds" type="number" min="1" inputmode="numeric"></label>
  </div>
  <div class="dlg-row" id="ivPre"><button class="btn" id="ivSave">Save as quick button</button><button class="btn" id="ivDel" hidden>Remove this button</button></div>
  <p class="small" id="ivMsg" style="text-align:center;margin:4px 0 0"></p>
  <div class="dlg-row"><button class="btn primary" id="ivStart">Start</button><button class="btn" id="ivStop">Stop</button><button class="btn" data-close>Close</button></div>
</dialog>

<script src="firebase-config.js"></script>
<script>
/* =====================================================================================
   PLAN DATA — edit this object to change the training plan. The logic below only reads it.

   blocks : the block library (like the top of the old spreadsheets).
            item fields: reps, name, how (one-line explanation), achilles (minimum Achilles step, 1–4),
            fallback (shown while your Achilles step is lower), fallback1 (shown at step 1 when the
            fallback itself needs step 2), intense (dropped in the light version),
            physioCheck (flagged on the Physio core screen as a possible clash).
            block fields: load (shows a "kg used" box), intense + lightAlt (block swapped in the light version),
            interval {work, rest, rounds} (adds an interval-timer button), test (shows the max-test inputs).
   weeks  : the week grid. Each day lists blocks with the number of sets (the "O O O" circles).
            Days not listed are off days. type: 'game' | 'recovery'. optional: true = optional third session.
   After the last week the app repeats weeks from `repeatFrom` until you add more weeks.
   ===================================================================================== */
const PLAN = {
  startDate: '2026-11-16',            // Monday of week 1
  repeatFrom: 5,                      // after the last week, cycle weeks 5…8
  restSeconds: 45,
  // Address of the small calendar proxy (see proxy/worker.js and README). Needed because the federation's
  // calendar server does not let a web page read it directly. Leave '' to use file upload only.
  calendarProxy: 'https://4q-ready-calendar.dan-9d4.workers.dev/',
  baseline: 'Starting level (self-reported, Nov 2026): 2 strict pull-ups, 15–20 push-ups.',
  yoga: { label: 'Open Down Dog', link: 'https://www.downdogapp.com/', androidPackage: 'com.downdogapp', routine: ['offDay', 'mobility'] },
  achillesSteps: {
    1: 'Isometric calf holds and slow two-leg calf raises. Marching drills only.',
    2: 'Loaded raises (straight and bent knee), single-leg eccentric lowers, low A-skips, accelerations at 70%.',
    3: 'Single-leg raises, accelerations at 75–80%, 5-4-5 shuttle steps, treadmill intervals.',
    4: 'Low pogo hops and harder accelerations. Only when the Achilles has been calm for weeks.',
  },
  blocks: {
    warmup: { name: 'Warmup', items: [
      { reps: '10', name: 'Neck side to side' }, { reps: '5+5', name: 'Neck circles' }, { reps: '10', name: 'Shoulder turns' },
      { reps: '10', name: 'Wrists & forearms' }, { reps: '10', name: 'Broomsticks' }, { reps: '8', name: '90/90 hips' },
      { reps: '10', name: 'Thoracic rots.' }, { reps: '15/side', name: 'Leg swings' }, { reps: '10', name: 'Bodyweight squats' },
      { reps: '30s', name: 'Down Dog to Cobra' } ] },
    calf1: { name: 'Calf & Achilles 1', items: [
      { reps: '45s', name: 'Isometric calf hold', how: 'Stand on the balls of both feet at mid-height and hold still; calms and loads the tendon.' },
      { reps: '10', name: 'Slow calf raise, two legs', how: '3 s up, 3 s down, full range on flat floor.' } ] },
    calf2: { name: 'Calf & Achilles 2', load: true, items: [
      { reps: '10', name: 'Slow calf raise, straight knee', how: '3 s up, 1 s pause, 3 s down. Hold a kettlebell once it feels easy.' },
      { reps: '10', name: 'Bent-knee calf raise', how: 'Same raise with knees bent about 30°, which targets the deeper soleus muscle.' },

  /* Short explanations, shown when an exercise is tapped. Looked up by exercise name (or the start of it) when

  explain: {
    'Neck side to side': 'Slowly tilt the ear towards the shoulder, left and right. No forcing.',
    'Neck circles': 'Slow half circles from shoulder to shoulder through the front, then the other way.',
    'Shoulder turns': 'Big, slow arm circles from the shoulder, forwards and backwards.',
    'Wrists & forearms': 'Circle the wrists, then gently stretch the palm side and the back of the forearm.',
    'Broomsticks': 'Hold a stick wide in both hands and pass it over the head and behind the back with straight arms, then back. Opens the shoulders.',
    '90/90 hips': 'Sit with both knees bent at 90°, one leg in front and one to the side, and rotate the knees over to the other side without using the hands if you can.',
    'Thoracic rots.': 'On all fours, one hand behind the head: rotate the elbow up to the ceiling and back down. The movement comes from the upper back.',
    'Leg swings': 'Hold a support and swing one leg forwards and backwards, then side to side. Loose and controlled.',
    'Bodyweight squats': 'Feet about shoulder width, sit down between the heels, chest up, knees follow the toes.',
    'Down Dog to Cobra': 'Flow from the downward dog (hips high, heels reaching down) to the cobra (hips low, chest up) and back.',
    'Isometric calf hold': 'Rise onto the balls of both feet to mid-height and hold still. Calms the tendon and loads it without movement.',
    'Slow calf raise': '3 s up, 3 s down through the full range on a flat floor, both feet unless stated.',
    'Bent-knee calf raise': 'The same raise with the knees bent about 30°, which targets the deeper soleus muscle.',
    'Calf raise holding': 'Slow two-leg calf raise with the kettlebell in one hand or at the chest: 3 s up, 1 s pause, 3 s down.',
    'Eccentric calf lower': 'Go up on two feet, shift onto one and lower slowly for about 4 s.',
    'Single-leg calf raise': 'Slow, full-range raise on one leg, fingertips on a wall for balance.',
    '2H Swings': 'Two-hand kettlebell swing: hinge at the hips, snap them forward and let the bell float to chest height. The arms only guide.',
    '1H Swing': 'The swing with one hand on the bell; keep the shoulders square and do not let the bell twist you.',
    'Goblet Squat': 'Hold the bell at the chest, sit down between the heels with the chest up, then stand. Slower tempo where stated.',
    'RDL': 'Romanian deadlift: soft knees, push the hips back with a flat back until the hamstrings pull, then stand tall.',
    'Bent-Over Row': 'Hinge forward with a flat back and pull the bell(s) to the lower ribs. Lower under control.',
    '1-arm': 'One-arm row: hinge forward, one hand on a support, pull the bell to the hip without rotating the trunk.',
    'Split Squat': 'Long stance, both feet pointing forward, lower the back knee straight down and stand up again. Hold a kettlebell where stated.',
    'Single-leg RDL': 'Hinge on one leg with the bell in the opposite hand, back flat, hips level.',
    'Swing, Clean, Press, 1H Squat': 'One flow with one bell: swing, clean it to the shoulder, press overhead, then squat with the bell at the shoulder. Finish the reps, then change sides.',
    'Curl, Halo, Pullover': 'Three moves in a row: biceps curl holding the bell by the horns, halo (circle the bell closely around the head), pullover lying on the back.',
    'Floor Press': 'Lie on the back with knees bent and press the bell(s) up from the floor; the upper arms touch down lightly between reps.',
    'Mace 360s': 'Swing the mace in a full circle behind the back and return it to the front. Ribs down, movement from the shoulders.',
    'Mace 300s': 'Like the 360, but the mace goes over one shoulder and comes back to the same side.',
    'Uppercuts': 'Drive the mace head upwards and across the body with a small turn of the hips, like an uppercut.',
    'Mace Split Squat': 'Split squat with the mace held upright in front of the chest.',
    'Ying Yang': 'Flowing figure of the mace from one hip across the body to the other shoulder and back, shifting the weight from foot to foot.',
    'Lateral Lunge': 'Step out to the side, sit back over that leg while the other stays straight, then push back to the middle.',
    'Lunge Chop & Swing': 'Step into a lunge and bring the mace diagonally down across the front knee, then swing it back up as you return.',
    'Grave Digger': 'A shovelling movement: hinge, scoop the mace head down by the front foot and lift it up over the opposite shoulder.',
    'Single Leg Hip Bridge': 'Lie on the back, one foot on the floor, lift the hips until they are level. Push through the heel.',
    'Push-ups': 'Body straight like a plank, chest down to about fist height, elbows at roughly 45°. Raise the hands on a bench to make it easier.',
    'TRX Rows': 'Body straight like a plank, pull the chest to the handles, lower under control. Walk the feet forward to make it harder.',
    'Suitcase Carry': 'Walk with the kettlebell in one hand like a suitcase, standing tall without leaning. Change hands for the way back.',
    'Dead bug': 'On the back, arms up and knees over the hips: lower the opposite arm and leg slowly while the lower back stays on the floor.',
    'Side Plank': 'On the forearm and the side of the foot (or the knee), body in one straight line.',
    'Dead Hang': 'Hang from the bar with straight arms, shoulders active (pulled slightly away from the ears).',
    'Scapular Pull-ups': 'From the hang, pull the shoulder blades down so the body rises a few centimetres. The arms stay straight.',
    'Negative Pull-ups': 'Jump or step to the top position and lower yourself as slowly as you can.',
    'Assisted Pull-ups': 'Pull-up with help: one foot on a chair, or feet on the floor under a low bar or the TRX. Full range.',
    'Strict pull-ups': 'From a full hang to the chin over the bar, no swing.',
    'Marching A': 'Walk tall, knee up to hip height, land softly on the mid-foot.',
    'Backward walk': 'Walk backwards with long steps, reaching back with the toes. Gentle on the knees and a good calf warm-up.',
    'Lateral shuffle': 'Low hips, feet never cross, push off the trailing leg.',
    'Step and stick': 'One quick step forward, then hold the landing still for 2 s.',
    'Low A-skips': 'Small, quiet skips with the knee up, barely leaving the floor.',
    'Acceleration': 'Start from a slight forward lean and build speed smoothly to the stated effort over the distance. Walk back as rest.',
    'Brisk walk': 'Fast, purposeful walking with an active arm swing.',
    'Brisk incline walk': 'Treadmill at an incline: 30 s fast walking, 60 s easy. The low-impact stand-in for the running intervals.',
    'Backpedal': 'Run backwards on the balls of the feet, hips low, short steps. Where stated, turn and jog out.',
    'Shuffle-to-stop': 'Three lateral shuffles, then stop dead and hold for 2 s. Deceleration practice.',
    '5-4-5 shuttle steps': 'Short floor shuttle: 5 steps out, plant, 4 back, plant, 5 out.',
    'Low pogo hops': 'Tiny two-foot hops with stiff ankles and quiet landings. Stop at any Achilles pain.',
    'Easy jog warm-up': 'Five minutes at a pace where you could still talk in full sentences.',
    '30 s hard / 60 s easy': 'Hard: heart rate 150–165. Easy: back down to 120–130. No all-out sprints on the belt.',
    '🐻': 'One round of the flow: bear crawl, downward dog, kick-through, ape (sideways squat hop on the hands), crab. Move slowly and keep the hips low.',
    'Ankle CARs': 'Draw the biggest slow circle you can with the foot; only the ankle moves.',
    'Calf wall stretch': 'Hands on the wall, back heel down. Straight knee for the upper calf, bent knee for the lower. Gentle; never push into Achilles pain.',
    'Hamstring stretch': 'One leg forward with the heel down, hinge from the hips with a flat back until the back of the thigh pulls.',
    'Knee → wall dorsiflexion': 'Foot a few centimetres from the wall, push the knee forward to touch the wall while the heel stays down.',
    'Single leg balance': 'Stand on one leg with a soft knee. Close the eyes to make it harder.',
    'Deep squat': 'Sit in the bottom of a squat, heels down, chest up; hold on to something if needed.',
    'Yoga': 'A short Down Dog practice with focus on hips, hamstrings, ankles/calves and back.',
    'Rolls': 'Gentle forward and backward rolls on a soft surface, over the shoulder rather than the neck.',
    'Standing Front Kicks': 'Controlled straight-leg kick to the front, hand reaching for the toes, standing tall.',
    'Table Tap to Compr. Slide': 'From the reverse table (hips up, facing the ceiling) tap one hand to the opposite foot, then sit through and slide the legs out long, lifting them briefly off the floor.',
    'Wrists 4 directions': 'On all fours, load the wrists gently with the fingers pointing forward, out, back and in.',
    'Floor Get-Ups': 'Lie down on the back and stand up again, using as little hand support as you can.',
    'Turkish Get-Up': 'From lying to standing with a kettlebell held overhead on a straight arm, and back down. Parked until your physio agrees.',
    'Superman variations': 'Lying face down, lift arms and legs off the floor. Parked until your physio agrees.',
  },

/* ================= Progress storage =================
   Signed out: everything lives in this browser (localStorage, key workout.data).
   Signed in: the data lives in the private cloud document workouts/{uid}; the Firebase module at the end
   of the page calls Workout.setAccount() with the loaded data plus load/save functions. A copy is kept in
   this browser while signed in so the app still opens offline. Settings always stay on the device. */

/* Merge two data sets without losing anything: union by date/id; where both have the same entry, the newer one wins. */
function mergeData(a, b) {
  a = normalize(a); b = normalize(b);
  const newer = (x, y) => !x ? y : !y ? x : ((y.t || 0) > (x.t || 0) ? y : x);
  const mergeMap = (A, B) => { const o = { ...A }; for (const k in B) o[k] = newer(A[k], B[k]); return o; };
  const out = { v: 1 };
  ['sessions', 'core', 'yoga', 'pain', 'tests', 'weekFlags', 'ivPresets'].forEach(k => out[k] = mergeMap(a[k], b[k]));
  out.achilles = newer(a.achilles, b.achilles);
  const yl = newer(a.yogaLink, b.yogaLink); if (yl) out.yogaLink = yl;
  const gc = newer(a.gameCal, b.gameCal); if (gc) out.gameCal = gc;
  // Physio lists: the newest "current" stays current, every other list ends up in the archive (once).
  const cur = newer(a.physio.current, b.physio.current);
  const byId = {};
  [...a.physio.archive, ...b.physio.archive, a.physio.current, b.physio.current].forEach(l => {
    if (l && (!cur || l.id !== cur.id) && !byId[l.id]) byId[l.id] = { ...l, archivedAt: l.archivedAt || Date.now() };
  });
  out.physio = { current: cur || null, archive: Object.values(byId).sort((x, y) => (y.t || 0) - (x.t || 0)) };
  return out;
}

function persist() {
  if (account.user) { store('cache.' + account.user.uid, data); account.dirty = true; queueSave(); }
  else store('data', data);
}
function setSyncStatus(s) { account.status = s; renderAccount(); }
function queueSave() { clearTimeout(saveTimer); setSyncStatus('Saving…'); saveTimer = setTimeout(flushSave, 1500); }
async function flushSave() {
  clearTimeout(saveTimer); saveTimer = null;
  if (!account.user || !account.saveFn) return;
  try {
    // Read, merge, write: another device may have saved since this one loaded.
    const remote = await account.loadFn();
    const before = JSON.stringify(data);
    data = mergeData(remote, data);
    account.cloudLoaded = true;
    await account.saveFn(JSON.parse(JSON.stringify(data)));
    store('cache.' + account.user.uid, data);
    account.dirty = false; setSyncStatus('All progress saved');
    if (JSON.stringify(data) !== before) render();
  } catch (e) { console.warn('Save failed', e); setSyncStatus('Couldn’t save — check your connection'); }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden && saveTimer) flushSave();
  if (!document.hidden) { if (account.user && account.dirty && !saveTimer) flushSave(); wakeLockSync(); render(); refreshGames(false); }
});
window.addEventListener('online', () => { if (account.user && account.dirty) flushSave(); });

async function setAccount(user, cloudData, saveFn, loadFn, loadedOk) {
  clearTimeout(saveTimer); saveTimer = null;
  if (user) {
    const cache = load('cache.' + user.uid, null);
    Object.assign(account, { user, saveFn, loadFn, cloudLoaded: !!loadedOk, dirty: false, status: loadedOk ? 'All progress saved' : 'Offline — changes are kept on this device' });
    data = mergeData(cloudData, cache);
    if (cache && JSON.stringify(mergeData(cloudData, null)) !== JSON.stringify(data)) account.dirty = true;
    render();
    // Progress made in this browser before signing in: offer (once per account) to merge it into the account.
    const guest = load('data', null);
    if (hasData(guest) && !load('guestAsked.' + user.uid, false)) {
      store('guestAsked.' + user.uid, true);
      if (await ask(`Merge the progress saved in this browser into ${user.name}'s account? Nothing is overwritten: sessions, ticks, pain scores and physio lists are combined.`, 'Merge', 'Not now')) {
        data = mergeData(data, guest); unstore('data'); account.dirty = true;
      }
    }
    store('cache.' + user.uid, data);
    if (account.dirty) queueSave();
  } else {
    if (account.user) unstore('cache.' + account.user.uid);
    Object.assign(account, { user: null, saveFn: null, loadFn: null, status: '', dirty: false, cloudLoaded: false });
    data = normalize(load('data', null));
  }
  render(); renderAccount(); refreshGames(false);
}

/* ================= Plan lookups ================= */
function weekInfo(dateIso) {
  const mon = mondayOf(dateIso);
  const diff = Math.round((parseDate(mon) - parseDate(mondayOf(PLAN.startDate))) / 6048e5);
  if (diff < 0) return { id: mon, n: diff + 1, pre: true, week: null };
  let idx = diff, repeatOf = null;
  if (idx >= PLAN.weeks.length) {
    const from = Math.min(Math.max((PLAN.repeatFrom || 1) - 1, 0), PLAN.weeks.length - 1), len = PLAN.weeks.length - from;
    idx = from + ((diff - from) % len); repeatOf = PLAN.weeks[idx].n;
  }
  // Lighter week: your own toggle wins; otherwise the calendar decides (a game Mon–Fri, or more than one game that week).
  const flag = data.weekFlags[mon], auto = autoLight(mon);
  return { id: mon, n: diff + 1, week: PLAN.weeks[idx], repeatOf, light: flag ? !!flag.light : auto, lightAuto: !flag && auto };
}
function dayInfo(dateIso) {
  const wi = weekInfo(dateIso);
  let day = (wi.week && wi.week.days[dayKey(dateIso)]) || { type: 'off' };
  if (calActive()) {            // game days come from the calendar instead of the plan's fixed Saturday
    const g = gamesOn(dateIso);
    if (g.length) day = { type: 'game', games: g, replaced: day.blocks ? day.title : null };
    else if (day.type === 'game') day = { type: 'off' };
  }
  const type = day.blocks ? 'session' : (day.type || 'off');
  return { wi, day, type };
}
const achStep = () => Math.min(4, Math.max(1, (data.achilles && data.achilles.step) || 1));
/* The blocks to show for a session: full or light version, with Achilles-gated drills swapped for their fallback. */
function sessionBlocks(day, light) {
  const step = achStep(), out = [];
  day.blocks.forEach((entry, i) => {
    let id = entry.block, lib = PLAN.blocks[id], swapped = false;
    if (!lib) return;
    if (light && lib.intense) { if (!lib.lightAlt || !PLAN.blocks[lib.lightAlt]) return; id = lib.lightAlt; lib = PLAN.blocks[id]; swapped = true; }
    const sets = light ? Math.max(1, Math.ceil(entry.sets / 2)) : entry.sets;
    const items = lib.items.filter(it => !(light && it.intense)).map(it => {
      const gated = it.achilles && step < it.achilles;
      return gated ? { ...it, name: (step === 1 && it.fallback1) || it.fallback || it.name, how: `Easier version while your Achilles step is ${step} (plan drill: ${it.name}, step ${it.achilles}).`, gated: true } : it;
    });
    out.push({ i, id, lib, sets, items, note: swapped ? 'Light version: no accelerations' : entry.note });
  });
  return out;
}

/* ================= Game calendar =================
   Each referee can set their own calendar link (Options). The link is saved with the data and synced;
   the downloaded games are cached on the device only and refreshed a few times a day. */
let games = load('games', null);      // { url, fetchedAt, list: [{ uid, date, time, title, league, location }] }
let calMsg = '';
const calUrl = () => (data.gameCal && data.gameCal.url) || '';
const calActive = () => !!(calUrl() && games && games.url === calUrl());
const gamesOn = d => calActive() ? games.list.filter(g => g.date === d) : [];
function autoLight(mon) {
  if (!calActive()) return false;
  const end = addDays(mon, 6), fri = addDays(mon, 4), wk = games.list.filter(g => g.date >= mon && g.date <= end);
  return wk.length > 1 || wk.some(g => g.date <= fri);
}
function parseICS(text) {
  const lines = String(text).replace(/\r\n?/g, '\n').replace(/\n[ \t]/g, '').split('\n');
  const unesc = s => s.replace(/\\n/gi, '\n').replace(/\\([,;\\])/g, '$1');
  const when = v => {
    const m = /^(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d)\d*(Z)?)?/.exec(v.trim()); if (!m) return null;
    if (m[6]) { const d = new Date(Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5])); return { date: iso(d), time: pad(d.getHours()) + ':' + pad(d.getMinutes()) }; }
    return { date: `${m[1]}-${m[2]}-${m[3]}`, time: m[4] ? `${m[4]}:${m[5]}` : '' };
  };
  const out = []; let ev = null, skip = false;
  for (const l of lines) {
    if (l === 'BEGIN:VEVENT') { ev = {}; continue; }
    if (l === 'END:VEVENT') { if (ev && ev.start && ev.status !== 'CANCELLED') out.push(ev); ev = null; continue; }
    if (l === 'BEGIN:VALARM') { skip = true; continue; }
    if (l === 'END:VALARM') { skip = false; continue; }
    const i = l.indexOf(':'); if (!ev || skip || i < 0) continue;
    const name = l.slice(0, i).split(';')[0].toUpperCase(), v = l.slice(i + 1);
    if (name === 'DTSTART') ev.start = when(v);
    else if (name === 'SUMMARY') ev.summary = unesc(v);
    else if (name === 'LOCATION') ev.location = unesc(v).replace(/\s*,\s*/g, ', ').trim();
    else if (name === 'UID') ev.uid = v.trim();
    else if (name === 'STATUS') ev.status = v.trim().toUpperCase();
  }
  // Only the game itself is kept (teams, league, place, time); the description with other people's names is not stored.
  return out.map(e => {
    const [first, ...rest] = (e.summary || 'Game').split('\n').map(s => s.trim()).filter(Boolean);
    return { uid: e.uid || e.start.date + e.start.time, date: e.start.date, time: e.start.time, title: first || 'Game', league: rest.join(' ').replace(/^\[|\]$/g, ''), location: e.location || '' };
  }).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
}
const cleanCalUrl = u => u.trim().replace(/^webcals?:\/\//i, 'https://');
const isHttps = u => u.toLowerCase().startsWith('https://') && !/\s/.test(u);
async function fetchICS(url) {
  const get = async u => {
    const r = await fetch(u, { cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status);
    const t = await r.text(); if (!/BEGIN:VCALENDAR/.test(t)) throw new Error('not a calendar'); return t;
  };
  try { return await get(url); }
  catch (e) { if (!PLAN.calendarProxy) throw e; return get(PLAN.calendarProxy + '?url=' + encodeURIComponent(url)); }
}

  catch (e) { calMsg = calActive() ? 'Could not refresh just now; showing the games loaded earlier.' : 'Could not load this calendar. Check the link, or upload the .ics file below.'; }
  render(); renderOptions();

/* Achilles advice for one day: above 3/10, or the morning score is worse than the morning before. */
function painAdvice(date) {
  const flagged = d => {
    const p = data.pain[d]; if (!p) return null;
    const vals = ['morning', 'pre', 'post'].map(k => p[k]).filter(v => v != null);
    if (!vals.length) return null;
    const y = data.pain[addDays(d, -1)];
    const why = [];
    if (Math.max(...vals) > 3) why.push('a score above 3/10');
    if (p.morning != null && y && y.morning != null && p.morning > y.morning) why.push('this morning is worse than yesterday morning');
    return why;
  };
  const today = flagged(date); if (!today || !today.length) return null;
  const y = flagged(addDays(date, -1));
  return { why: today, physio: !!(y && y.length) || Math.max(...['morning', 'pre', 'post'].map(k => (data.pain[date] || {})[k] ?? 0)) > 5 };

  const bars = days.map(d => { const w = worst(d); return `<i class="${w == null ? 'none' : w > 3 ? 'hi' : ''}" style="height:${w == null ? 3 : Math.max(6, w * 10)}%" title="${fmtDate(d)}: ${w == null ? 'no entry' : w + '/10'}"></i>`; }).join('');

    .map(([d, s]) => { const di = dayInfo(d); const w = Object.entries(s.weights || {}).filter(([, v]) => v).map(([i, v]) => {

      <div class="row" style="margin-top:8px"><label class="small">Date<input type="date" id="tDate" value="${today}" style="width:160px"></label>
        <label class="small">Pull-ups<input class="tiny" id="tPull" type="number" min="0" inputmode="numeric"></label>

      <ol class="small" style="margin:0;padding-left:20px">${[1, 2, 3, 4].map(n => `<li>${esc(PLAN.achillesSteps[n])}</li>`).join('')}</ol>
      <p class="small muted">Pain rule: up to about 3/10 is fine if it is not worse the next morning. Otherwise drop back a step. Move up only after a calm week.
        Check with your physio if two days in a row are flagged, pain goes above 5/10, the tendon is swollen or thickened, or morning stiffness does not ease after a few minutes of walking.</p></div>
    <div class="card"><h2>Weeks</h2><table><tr><th>Week of</th><th>Sessions</th><th>Physio core</th><th>Yoga</th></tr>

      <p class="small muted" style="margin:0 0 8px">Export everything as a JSON file, or import a file. Importing merges into what is here; nothing is overwritten blindly.</p>
      <div class="row"><button class="btn" data-act="export">Export JSON</button><button class="btn" data-act="import">Import JSON</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden></div><p class="small" id="ioMsg"></p></div>`;
}

/* ================= Timers ================= */
let audioCtx = null;
function beep(n = 1, freq = 880) {
  if (navigator.vibrate) try { navigator.vibrate(n > 1 ? [200, 100, 200] : 200); } catch (e) {}
  if (!settings.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    for (let i = 0; i < n; i++) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime + i * 0.28;
      o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.22); o.start(t); o.stop(t + 0.24);
    }
  } catch (e) {}
}
const mmss = s => `${Math.floor(s / 60)}:${pad(Math.floor(s % 60))}`;
const rest = { end: 0, timer: null };
function restStart(secs) {
  if (audioCtx == null && settings.sound) beep(0);           // unlock audio on this tap
  rest.end = Date.now() + secs * 1000; clearInterval(rest.timer); rest.timer = setInterval(restTick, 250); restTick();
}
function restTick() {
  const left = Math.ceil((rest.end - Date.now()) / 1000), bar = $('#restBar');
  if (left <= 0) { clearInterval(rest.timer); rest.timer = null; bar.hidden = true; if (rest.end) beep(2); rest.end = 0; return; }
  bar.hidden = false; $('#restLeft').textContent = mmss(left);
}
function restStop() { rest.end = 0; clearInterval(rest.timer); rest.timer = null; $('#restBar').hidden = true; }

const iv = { start: 0, timer: null, key: '', work: 30, rest: 60, rounds: 6, pid: '' };
const ivPresets = () => Object.values(data.ivPresets || {}).filter(p => p && !p.del && p.work > 0).sort((a, b) => (a.t || 0) - (b.t || 0));
const ivDur = s => s >= 60 && s % 60 === 0 ? `${s / 60} min` : s < 60 ? `${s} s` : mmss(s);
const ivLabel = p => `${p.rounds} × ${ivDur(p.work)} / ${ivDur(p.rest)}`;
function ivRead() {
  const u = +$('#ivUnit').value || 1;
  return { work: Math.max(1, Math.round((+$('#ivWork').value || 0) * u) || 30), rest: Math.max(0, Math.round((+$('#ivRest').value || 0) * u)), rounds: Math.max(1, Math.round(+$('#ivRounds').value) || 1) };
}
function ivOpen(work, restS, rounds, pid, go) {
  ivStop(); const u = work >= 60 && work % 60 === 0 && restS % 60 === 0 ? 60 : 1;
  $('#ivUnit').value = u; $('#ivWork').value = work / u; $('#ivRest').value = restS / u; $('#ivRounds').value = rounds;
  iv.pid = pid || ''; $('#ivDel').hidden = !iv.pid; $('#ivMsg').textContent = '';
  $('#ivDlg').showModal(); if (go) ivStart();
}
function ivStart() {
  Object.assign(iv, ivRead());
  if (audioCtx == null && settings.sound) beep(0);
  iv.start = Date.now(); iv.key = ''; clearInterval(iv.timer); iv.timer = setInterval(ivTick, 200); $('#ivCfg').hidden = true; $('#ivPre').hidden = true; $('#ivMsg').textContent = ''; ivTick();
}
$('#ivSave').onclick = () => {
  const p = ivRead(), same = ivPresets().find(q => q.work === p.work && q.rest === p.rest && q.rounds === p.rounds);
  if (same) { iv.pid = same.id; $('#ivMsg').textContent = 'This one is already a quick button.'; }
  else { const id = 'p' + Date.now().toString(36); data.ivPresets[id] = { id, ...p, t: now() }; iv.pid = id; persist(); render(); $('#ivMsg').textContent = `Saved: ${ivLabel(p)}.`; }
  $('#ivDel').hidden = false;
};
$('#ivDel').onclick = () => {
  if (!iv.pid) return;
  data.ivPresets[iv.pid] = { id: iv.pid, del: true, t: now() }; iv.pid = ''; persist(); render();
  $('#ivDel').hidden = true; $('#ivMsg').textContent = 'Quick button removed.';
};
function ivStop(msg) {
  clearInterval(iv.timer); iv.timer = null; iv.start = 0;
  $('#ivDlg').classList.remove('hard'); $('#ivCfg').hidden = false; $('#ivPre').hidden = false;
  $('#ivPhase').textContent = msg || 'Interval timer'; $('#ivBig').textContent = msg ? '✓' : ''; $('#ivBig').hidden = !msg; $('#ivRound').textContent = '';
}
function ivTick() {
  const lead = 5, el = (Date.now() - iv.start) / 1000, cyc = iv.work + iv.rest;
  let phase, left, round = 0;
  if (el < lead) { phase = 'GET READY'; left = lead - el; }
  else {
    const e = el - lead; round = Math.floor(e / cyc);
    if (round >= iv.rounds) { beep(3, 660); return ivStop('Done'); }
    const p = e - round * cyc; phase = p < iv.work ? 'HARD' : 'EASY'; left = p < iv.work ? iv.work - p : cyc - p; round++;
  }
  const key = phase + round;
  if (key !== iv.key) { if (iv.key) beep(phase === 'HARD' ? 2 : 1, phase === 'HARD' ? 990 : 660); iv.key = key; }
  $('#ivDlg').classList.toggle('hard', phase === 'HARD');
  $('#ivPhase').textContent = phase; $('#ivBig').hidden = false; $('#ivBig').textContent = left > 60 ? mmss(Math.ceil(left)) : Math.ceil(left);
  $('#ivRound').textContent = round ? `Round ${round} of ${iv.rounds}` : `${iv.rounds} × ${ivDur(iv.work)} hard / ${ivDur(iv.rest)} easy`;
}
$('#ivStart').onclick = ivStart; $('#ivStop').onclick = () => ivStop();
$('#ivDlg').addEventListener('close', () => ivStop());

/* ---------- keep the screen awake (optional) ---------- */
let wakeLock = null;
async function wakeLockSync() {
  if (!('wakeLock' in navigator)) return;
  try {
    if (settings.keepAwake && !document.hidden) { if (!wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } }
    else if (wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}

/* ================= Export / import ================= */
function exportJSON() { return JSON.stringify({ app: 'workout-planner', version: 1, exportedAt: new Date().toISOString(), data }, null, 2); }
function importJSON(text) {
  const obj = JSON.parse(text), d = obj && obj.app === 'workout-planner' ? obj.data : null;
  if (!d || typeof d !== 'object' || !d.sessions) throw new Error('This is not a 4th Quarter Ready export file.');
  data = mergeData(data, d); persist(); render();
}
function downloadExport() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([exportJSON()], { type: 'application/json' }));
  a.download = `4q-ready-${iso(new Date())}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ================= Events ================= */
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) showTab(b.dataset.tab); });
function showTab(t) { settings.tab = t; saveSettings(); render(); window.scrollTo(0, 0); }
$('#restBar').addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (a.dataset.act === 'rest-stop') restStop(); else { rest.end += 15000; restTick(); }
});
view.addEventListener('click', async e => {
  const tabLink = e.target.closest('[data-tab]'); if (tabLink) return showTab(tabLink.dataset.tab);
  const b = e.target.closest('[data-act]'); if (!b || b.matches('input')) return;
  const act = b.dataset.act, v = b.dataset.v, date = viewDate;
  switch (act) {
    case 'day': viewDate = v === '0' ? todayIso() : addDays(viewDate, +v); weekView = null; break;
    case 'open-day': viewDate = v; settings.tab = 'today'; saveSettings(); window.scrollTo(0, 0); break;
    case 'week': weekView = addDays(weekView || mondayOf(viewDate), +v); break;
    case 'ready': touchSession(date, s => { s.readiness = s.readiness === v ? null : v; if (s.status === 'skipped') s.status = null; }); break;
    case 'tick': {
      const i = b.dataset.i, k = +b.dataset.k; let added = false;
      touchSession(date, s => { const cur = s.ticks[i] || 0; added = cur !== k + 1; s.ticks[i] = added ? k + 1 : k; });
      if (added && settings.autoRest) restStart(PLAN.restSeconds || 45);
      break; }
    case 'toggle-block': { const k = date + ':' + b.dataset.i; openBlocks.has(k) ? openBlocks.delete(k) : openBlocks.add(k); break; }
    case 'finish': touchSession(date, s => { s.status = s.status === 'done' ? null : 'done'; }); break;
    case 'skip': touchSession(date, s => { s.status = s.status === 'skipped' ? null : 'skipped'; }); break;
    case 'pain': setPain(date, b.dataset.field, +v); break;
    case 'step': data.achilles = { step: +v, t: now() }; persist(); break;
    case 'core-round': setCore(date, c => { c.rounds = (c.rounds || 0) + 1; c.checked = []; }); break;
    case 'core-undo': setCore(date, c => { c.rounds = Math.max(0, (c.rounds || 0) - 1); }); break;
    case 'yoga': data.yoga[date] = { done: !(data.yoga[date] && data.yoga[date].done), t: now() }; persist(); break;
    case 'routine': return info(`<h2 style="margin-top:0">Short routine (10–20 min)</h2>` + PLAN.yoga.routine.map(id => { const bl = PLAN.blocks[id]; return bl ? `<h3 style="margin:10px 0 4px">${esc(bl.name)}</h3>` + bl.items.map(it => `<div class="ex"><span class="reps">${esc(it.reps)}</span><span>${esc(it.name)}</span>${it.how || explainOf(it.name) ? `<span class="how">${esc(it.how || explainOf(it.name))}</span>` : ''}</div>`).join('') : ''; }).join(''));
    case 'rest': return restStart(+v);
    case 'interval': return ivOpen(+b.dataset.work, +b.dataset.rest, +b.dataset.rounds, b.dataset.pid || '', !!b.dataset.go);
    case 'physio-edit': { const c = data.physio.current; physioEdit = c ? c.lines.map((name, i) => ({ name, reps: (c.reps && c.reps[i]) || '' })) : [{ name: '', reps: '' }]; break; }
    case 'pe-add': physioEdit.push({ name: '', reps: '' }); break;
    case 'pe-del': physioEdit.splice(+b.dataset.i, 1); break;
    case 'pe-up': case 'pe-down': { const i = +b.dataset.i, j = act === 'pe-up' ? i - 1 : i + 1; [physioEdit[i], physioEdit[j]] = [physioEdit[j], physioEdit[i]]; break; }
    case 'pe-cancel': physioEdit = null; break;
    case 'pe-save': {
      // Small edits keep the same list (no archive entry); only pasting a new list archives the old one.
      const rows = physioEdit.map(r => ({ name: r.name.trim(), reps: r.reps.trim() })).filter(r => r.name);
      const lines = rows.map(r => r.name), reps = rows.map(r => r.reps);
      if (!lines.length) return;
      const cur = data.physio.current, t = now();
      if (JSON.stringify([lines, reps]) !== JSON.stringify(cur ? [cur.lines, cur.lines.map((_, i) => (cur.reps && cur.reps[i]) || '')] : null)) {
        data.physio.current = cur ? { ...cur, lines, reps, t } : { id: 'p' + t, lines, reps, t };
        const c = data.core[todayIso()]; if (c && c.checked && c.checked.length) data.core[todayIso()] = { ...c, checked: [], t };
        persist();
      }
      physioEdit = null; break; }
    case 'physio-save': {
      const lines = parseKeep($('#keepText').value), rep = $('#keepReps').value.trim();
      if (!lines.length) return;
      replacePhysio(lines, lines.map(() => rep)); physioEdit = null; break; }
    case 'physio-view': { const l = data.physio.archive[+b.dataset.i]; return info(`<h2 style="margin-top:0">List from ${fmtStamp(l.t)}</h2><p class="small muted">Archived ${fmtStamp(l.archivedAt)}</p><ol style="padding-left:22px">${l.lines.map((x, i) => `<li>${repTag(l, i)}${esc(x)}</li>`).join('')}</ol>`); }
    case 'physio-restore': {
      const l = data.physio.archive[+b.dataset.i];
      if (!await ask(`Make the list from ${fmtStamp(l.t)} the current one? The current list moves to the archive.`, 'Restore')) return;
      data.physio.archive = data.physio.archive.filter(x => x.id !== l.id);
      replacePhysio(l.lines, l.reps); break; }
    case 'test-add': {
      const d = $('#tDate').value, pu = $('#tPull').value, ps = $('#tPush').value;
      if (!d || (pu === '' && ps === '')) return;
      data.tests[d] = { ...(data.tests[d] || {}), ...(pu !== '' ? { pullups: +pu } : {}), ...(ps !== '' ? { pushups: +ps } : {}), t: now() }; persist(); break; }
    case 'export': downloadExport(); $('#ioMsg').textContent = 'Export file saved to your downloads.'; return;
    case 'import': return $('#importFile').click();
    default: return;
  }
  render();
});
view.addEventListener('input', e => { const el = e.target; if ((el.dataset.field === 'pe' || el.dataset.field === 'per') && physioEdit) physioEdit[+el.dataset.i][el.dataset.field === 'pe' ? 'name' : 'reps'] = el.value; });
view.addEventListener('change', e => {
  const el = e.target, act = el.dataset.act, f = el.dataset.field, date = viewDate;
  if (act === 'core-check') {
    const i = +el.dataset.i, n = data.physio.current ? data.physio.current.lines.length : 0;
    setCore(date, c => { c.checked = (el.checked ? [...new Set([...c.checked, i])] : c.checked.filter(x => x !== i)).filter(x => x < n); });
    // Every box ticked: count the round and clear the ticks (after a moment, so the last tick is seen).
    if (n && coreOf(date).checked.length >= n) setTimeout(() => {
      if (coreOf(date).checked.length < n) return;
      setCore(date, c => { c.rounds = (c.rounds || 0) + 1; c.checked = []; }); render();
    }, 2000);
    return;
  }
  if (act === 'set') { settings[el.dataset.k] = el.checked; saveSettings(); if (el.dataset.k === 'keepAwake') wakeLockSync(); return; }
  if (act === 'week-light') { data.weekFlags[el.dataset.v] = { light: el.checked, t: now() }; persist(); return render(); }
  if (f === 'weight') return touchSession(date, s => { s.weights[el.dataset.i] = el.value.trim(); });
  if (f === 'notes') return touchSession(date, s => { s.notes = el.value; });
  if (f === 'test-pullups' || f === 'test-pushups') {
    const k = f === 'test-pullups' ? 'pullups' : 'pushups', t = { ...(data.tests[date] || {}) };
    if (el.value === '') delete t[k]; else t[k] = +el.value;
    t.t = now(); data.tests[date] = t; return persist();
  }
  if (el.id === 'importFile' && el.files[0]) {
    const r = new FileReader();
    r.onload = () => { let msg = 'Import merged into your data.'; try { importJSON(r.result); } catch (err) { msg = 'Import failed: ' + err.message; } const m = $('#ioMsg'); if (m) m.textContent = msg; };
    r.readAsText(el.files[0]);
  }
});

/* ================= Account dialog (same pattern as FretWise) ================= */
const AUTH_ERRORS = {
  'auth/invalid-credential':'Wrong email or password.', 'auth/wrong-password':'Wrong email or password.', 'auth/user-not-found':'No account with that email — try Create account.',
  'auth/email-already-in-use':'That email already has an account — try Sign in.', 'auth/weak-password':'Password needs at least 6 characters.',
  'auth/invalid-email':'That email address doesn’t look right.', 'auth/missing-password':'Enter a password.', 'auth/too-many-requests':'Too many attempts — wait a minute and try again.',
  'auth/network-request-failed':'No connection — check your internet.', 'auth/unauthorized-domain':'This site isn’t authorised in Firebase yet (Authentication → Settings → Authorized domains).',
  'auth/popup-blocked':'Your browser blocked the sign-in popup — allow popups for this site.',
};
function renderAccount() {
  const btn = $('#acctBtn');
  btn.hidden = !account.available;
  btn.textContent = account.user ? '● ' + account.user.name.split(/[ @]/)[0] : 'Sign in';
  btn.title = account.user ? 'Account' : 'Sign in to sync across devices';
  $('#syncStatus').textContent = account.user ? account.status : 'Saved on this device';
  if (!$('#acctDlg').open) return;
  $('#acctBody').innerHTML = account.user
    ? `<h2 style="margin-top:0">Your account</h2><p>Signed in as <b>${esc(account.user.name)}</b></p>
       <p class="small muted">${esc(account.status)}</p>
       <p class="small muted">Sessions, physio lists, Achilles scores and tests are saved to your account and follow you to any device.</p>
       <button class="btn" data-act="signout">Sign out</button>`
    : `<h2 style="margin-top:0">Sync your training log</h2>
       <p class="small muted">Sign in to keep your data on any device. Without an account it is saved in this browser only.</p>
       <button class="btn primary wide" data-act="google">Continue with Google</button>
       <div class="or">or with email</div>
       <input type="email" id="acEmail" placeholder="Email" autocomplete="email" style="margin-bottom:8px">
       <input type="password" id="acPass" placeholder="Password (6+ characters)" autocomplete="current-password">
       <div class="dlg-row"><button class="btn primary" data-act="signin">Sign in</button><button class="btn" data-act="signup">Create account</button></div>
       <button class="linkish" data-act="reset">Forgot password?</button>
       <p class="small" id="acMsg"></p>`;
}
$('#acctBtn').addEventListener('click', () => { $('#acctDlg').showModal(); renderAccount(); });
$('#acctBody').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b || !window.WorkoutCloud) return;
  const cloud = window.WorkoutCloud, act = b.dataset.act, email = $('#acEmail')?.value.trim(), pass = $('#acPass')?.value;
  const msg = (t, ok) => { const m = $('#acMsg'); if (m) { m.textContent = t; m.style.color = ok ? 'var(--good)' : 'var(--bad)'; } };
  try {
    if (act === 'google') await cloud.signInGoogle();
    else if (act === 'signin') await cloud.signInEmail(email, pass);
    else if (act === 'signup') await cloud.signUpEmail(email, pass);
    else if (act === 'reset') { if (!email) return msg('Enter your email first.'); await cloud.resetPassword(email); return msg('Password reset email sent.', true); }
    else if (act === 'signout') { if (saveTimer || account.dirty) await flushSave(); await cloud.signOut(); }
    $('#acctDlg').close();
  } catch (err) {
    if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') return;
    msg(AUTH_ERRORS[err.code] || 'Something went wrong: ' + (err.message || err));
  }
});
window.Workout = { setAccount, cloudReady() { account.available = true; renderAccount(); },
  // exposed for testing and debugging in the browser console
  mergeData, parseKeep, parseICS, exportJSON, importJSON, getData: () => data };

/* ================= Start ================= */
applyTheme(); render(); renderAccount(); wakeLockSync(); refreshGames(false);
// A new day while the app stays open: follow the calendar.
let lastToday = todayIso();
setInterval(() => { const t = todayIso(); if (t !== lastToday) { if (viewDate === lastToday) viewDate = t; lastToday = t; render(); } }, 60000);

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  const local = ['localhost', '127.0.0.1'].includes(location.hostname);   // no caching while developing, unless ?sw=1
  if (!local || new URLSearchParams(location.search).has('sw'))
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>

<!-- Cloud accounts (Firebase). Only runs on a web server with a config in firebase-config.js;
     opened as a local file the app works signed out. -->
<script type="module">
const cfg = window.FIREBASE_CONFIG;
if (cfg && location.protocol !== 'file:') {
  try {
    const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const [{ initializeApp }, A, F] = await Promise.all([
      import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js'),
    ]);
    const app = initializeApp(cfg), auth = A.getAuth(app), db = F.getFirestore(app);
    window.WorkoutCloud = {
      signInGoogle: () => A.signInWithPopup(auth, new A.GoogleAuthProvider()),
      signInEmail: (email, pass) => A.signInWithEmailAndPassword(auth, email, pass),
      signUpEmail: (email, pass) => A.createUserWithEmailAndPassword(auth, email, pass),
      resetPassword: email => A.sendPasswordResetEmail(auth, email),
      signOut: () => A.signOut(auth),
    };
    A.onAuthStateChanged(auth, async u => {
      if (!u) return Workout.setAccount(null);
      // One private document per user: workouts/{uid} → { data, updatedAt }
      const ref = F.doc(db, 'workouts', u.uid);
      const loadFn = async () => { const snap = await F.getDoc(ref); return snap.exists() ? (snap.data().data || {}) : {}; };
      let cloud = {}, ok = true;
      try { cloud = await loadFn(); } catch (e) { ok = false; console.warn('Could not load cloud data', e); }
      Workout.setAccount({ uid: u.uid, name: u.displayName || u.email || 'You' }, cloud,
        d => F.setDoc(ref, { data: d, updatedAt: F.serverTimestamp() }, { merge: false }), loadFn, ok);
    });
    Workout.cloudReady();
  } catch (e) { console.warn('Cloud sign-in unavailable — using this browser only.', e); }
}
</script>
